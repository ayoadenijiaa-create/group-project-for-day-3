<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jessica Randall - Social Links</title>

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* =========================
       PAGE
    ========================= */

    body {
      min-height: 100vh;
      background-color: #2118be;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
    }

    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card {
      width: 384px;
      background-color: #5847a2;

      padding: 40px;

      border-radius: 12px;

      text-align: center;
    }

    /* =========================
       PROFILE IMAGE
    ========================= */

    .profile-image {
      width: 88px;
      height: 88px;

      border-radius: 50%;

      object-fit: cover;

      display: block;
      margin: 0 auto 24px;
    }

    /* =========================
       NAME
    ========================= */

    .profile-name {
      font-size: 24px;
      font-weight: 700;

      line-height: 1.2;

      margin-bottom: 8px;
    }

    /* =========================
       LOCATION
    ========================= */

    .profile-location {
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      margin-bottom: 28px;
    }

    /* =========================
       DESCRIPTION
    ========================= */

    .profile-description {
      color: #3b1717;

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 24px;
    }

    /* =========================
       SOCIAL LINKS
    ========================= */

    .social-links {
      display: flex;
      flex-direction: column;

      gap: 16px;
    }

    .social-links a {
      width: 100%;

      padding: 14px 10px;

      background-color: #333333;
      color: #ffffff;

      border-radius: 8px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    /* =========================
       HOVER EFFECT
    ========================= */

    .social-links a:hover {
      background-color: #fb0505;
      color: #141414;

      transform: translateY(-2px);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 24px;
      }

      .profile-card {
        width: 100%;
        max-width: 384px;

        padding: 24px;
      }

      .profile-image {
        width: 88px;
        height: 88px;
      }

    }

  </style>
</head>

<body>

  <main class="profile-card">

    <!-- Profile picture -->
    <img class="profile-image" src="https://i.pravatar.cc/176?img=47" alt="Jessica Randall">

    <!-- Name -->
    <h1 class="profile-name">
      CLASS 3
    </h1>

    <!-- Location -->
    <p class="profile-location">
      LAGOS, NIGERIA
    </p>

    <!-- Description -->
    <p class="profile-description">
      "Front-end developer and a student of scroll to skill."
    </p>

    <!-- Social links -->
    <nav class="social-links" aria-label="Social links">

      <a href="file:///C:/Users/HP/Desktop/last%20hope%203.html#" target="_blank">

      </a>

      <a href="file:///C:/Users/HP/Desktop/last%20hope%203.html#" target="_blank">

      </a>

    </nav>

  </main>
